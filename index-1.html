function messageAge(label){if(label==='오늘')return 0;if(label==='어제')return 1;const n=Number(label.match(/\d+/)?.[0]||0);return n*(label.includes('년')?365:label.includes('개월')||label.includes('달')?30:1)}
function messageList(){const panel=$('.panel');panel.classList.add('messages-app');panel.classList.remove('chat-app');$('.panel header').textContent='메시지';const m=$('.panel main');m.innerHTML='';Object.keys(chatData).sort((a,b)=>messageAge(chatData[a].at(-1).date)-messageAge(chatData[b].at(-1).date)).forEach(name=>{const groups=chatData[name],last=groups[groups.length-1],message=last.messages[last.messages.length-1];const b=document.createElement('button');b.className='thread';const avatar=document.createElement('span');avatar.className='thread-avatar';senderAvatar(avatar,name);const info=document.createElement('span');info.className='thread-info';const title=document.createElement('strong');title.textContent=displaySender(name);if(serviceSenders.includes(name)||blockedSenders.includes(name)){const unsaved=document.createElement('small');unsaved.className='unsaved-label';unsaved.textContent='(저장되지 않은 번호)';info.append(unsaved)}const preview=document.createElement('span');preview.textContent=message.text;info.append(title,preview);const date=document.createElement('small');date.textContent=last.date;b.append(avatar,info,date);b.onclick=()=>openChat(name);m.append(b)})}
function openChat(name){current='대화';const panel=$('.panel');panel.classList.remove('phone-app','messages-app');panel.classList.add('chat-app');$('.panel .tabs')?.remove();const h=$('.panel header');h.innerHTML='';const back=document.createElement('button');back.className='chat-back';back.setAttribute('aria-label','메시지 목록으로');back.textContent='‹';back.onclick=()=>openApp('메시지');const avatar=document.createElement('span');avatar.className='chat-avatar';senderAvatar(avatar,name);const title=document.createElement('strong');title.textContent=displaySender(name);const more=document.createElement('button');more.className='chat-more';more.textContent='⋮';more.setAttribute('aria-label','더 보기');if(serviceSenders.includes(name)||blockedSenders.includes(name)){const titleGroup=document.createElement('div');titleGroup.className='chat-title-group';const label=document.createElement('small');label.textContent='(저장되지 않은 번호)';titleGroup.append(title,label);h.append(back,avatar,titleGroup,more)}else{h.append(back,avatar,title,more)}const m=$('.panel main');m.className='chat-messages';m.innerHTML='';chatData[name].forEach(group=>{const date=document.createElement('div');date.className='chat-date';date.textContent=group.date;m.append(date);group.messages.forEach(msg=>{const row=document.createElement('div');row.className='bubble-row '+(msg.self?'sent':'received');const b=document.createElement('div');b.className='bubble';b.textContent=msg.text;row.append(b);m.append(row)})});panel.querySelector('.composer')?.remove();const composer=document.createElement('form');composer.className='composer';composer.innerHTML='<input aria-label="메시지 입력" disabled><button type="button" aria-label="보내기" disabled>↑</button>';panel.append(composer);if(blockedSenders.includes(name)){const notice=document.createElement('div');notice.className='blocked-notice';notice.textContent='차단된 사용자입니다.';m.append(notice)}m.scrollTop=m.scrollHeight}

const newsData=[{"tag": "속보", "title": "트루뷰 체육관서 서프 에이스 난동… 다수 사상자, 현장 수습 중", "paper": "솔루션 투데이", "time": "12분 전", "count": "2,418", "body": ["트루뷰 트라이테일 체육관에서 아르카디아 투사 서프 에이스가 마물 영혼을 주입한 뒤 갑자기 난동을 부려 다수의 사상자가 발생했다. 현장 통제와 피해자 이송은 현재도 이어지고 있다.", "목격자들에 따르면 서프 에이스는 총기를 난사하듯 무차별적인 타겟 지정 능력을 넓은 범위에 사용했다. 체육관 이용객뿐 아니라 대피하던 시민들도 공격 범위에 포함된 것으로 전해졌다.", "부상자 중에는 레귤레이터를 통해 소생한 시민도 있는 것으로 알려졌다. 그러나 레귤레이터 미착용자와 저장된 영혼 자원을 모두 소모한 시민 일부는 사망했다. 당국은 정확한 피해 규모와 신원을 확인 중이며 최종 집계는 아직 공개하지 않았다.", "이후 서프 에이스는 마물과 유사한 형태로 변해 체육관 밖으로 도주한 것으로 전해졌다. 맨몸의 도전자와 교전하던 중 신체가 녹아 사라졌다는 목격 진술도 확보됐다.", "당국은 현장에 남은 잔류 물질을 조사하고 있다. 서프 에이스의 생사와 소생 여부는 확인되지 않았으며, 주변 시민들에게 통제 구역에 접근하지 말 것을 요청했다."], "comments": ["능력광역기인거 알면서 저기서 쳐쓴게 레전드네 ㅋㅋㅋㅋ", "운동하러 간 분들이 무슨 죄입니까. 사망하신 분들 가족은 어쩌라고요. 철저하게 조사해 주세요.", "와씨발 나 어제 저기갔는데 오늘갔으면 뒤졋겠네", "소생 되면 다 끝인줄 아나... 세상이 어찌 이리 됐는지...", "팬들 또 영혼침식 어쩌고 시작했노 ㅋㅋ 그럼 피해자도 아프다면서 쏘면 되냐?", "레귤레이터 안 찬 사람이 잘못이라는 새끼는 진짜 대가리 열어보고 싶다", "기사 끝까지 읽어라 생사 확인 안됐다잖아 벌써 죽었다고 뇌피셜 돌리지말고", "불쌍한 건 피해자지 저새끼가 아니라고요 제발 좀"], "commentIds": ["o4coer2", "a1ckfg", "vl5wzh1", "kruduq6r8", "vgnt78", "6oeyge", "x6ol3m2ka", "hm0fwlk4"]}, {"tag": "현장", "title": "“도망치는 사람까지 겨눴다” 무차별 타겟 지정에 아수라장", "paper": "나인일보", "time": "28분 전", "count": "1,906", "body": ["평소와 다르지 않던 체육관은 순식간에 대피 현장으로 바뀌었다. 트루뷰 트라이테일 체육관 이용객들은 서프 에이스의 공격이 특정 상대를 향한 것이 아니었다고 입을 모았다.", "한 이용객은 “누가 상대인지도 모르겠더라. 도망치는 사람까지 타겟이 됐다”며 “경기장이 아닌 곳에서 그런 능력을 쓰면 시민들은 어떻게 피하느냐”고 말했다.", "또 다른 목격자는 서프 에이스가 영혼을 주입한 직후 행동이 급격히 달라졌다고 진술했다. 다만 주입 경위와 난동의 직접적인 원인은 조사 중이다.", "레귤레이터가 있다는 이유로 피해를 가볍게 볼 수 없다는 비판도 나온다. 현장에서는 영혼 자원 소진자와 레귤레이터 미착용자의 사망이 발생했고, 소생한 피해자 역시 부상과 공포를 호소하고 있다.", "현재 체육관 운영은 중단됐다. 구조 인력은 잔류 위험 요소를 확인하며 내부 수색을 이어가고 있다."], "comments": ["도망가는사람까지찍음? 미친거아님????", "총질 잘한다고 띄워주니까 지가 뭐라도 되는 줄 알았나보네 ㅉㅉ", "아니 진짜 무서워요.. 저기 친구 다니는데 연락이 안 돼요", "저거 쉴드치던 팬덤 어디감? 입꾹닫하고 튀었쥬?ㅋㅋ", "그렇게 성깔 더럽게 굴더니 결국 사고를 치는구만. 사람은 안 바뀐다.", "폭주고 나발이고 씨발 사람 죽었는데 컨디션이 왜나와"], "commentIds": ["krzw1v5", "vcl680", "f6s7o96g7", "qbey3wegy", "tvt3acupo", "jmvm0klk5"]}, {"tag": "추적", "title": "마 function netShell(){const panel=$('.panel');panel.classList.add('internet-app');panel.classList.remove('chat-app','messages-app','phone-app');$('.panel .composer')?.remove();$('.panel .tabs')?.remove();$('.panel header').innerHTML='<button class="net-home" aria-label="인터넷 홈">⌂</button><div class="address">▣ &nbsp; 나인 포털</div><button class="net-refresh" aria-label="새로고침">↻</button>';$('.net-home').onclick=internetHome;$('.net-refresh').onclick=()=>{if(current==='기사')articleOpen(activeArticle);else internetHome()};$('.panel main').className='net-content';$('.panel main').scrollTop=0;return $('.panel main')}
let activeArticle=0;
function internetHome(){current='인터넷';const m=netShell();m.innerHTML='<div class="portal-search"><strong>NINE</strong><form><input aria-label="검색" placeholder="검색"><button aria-label="검색">⌕</button></form></div><div class="portal-cats"><b>뉴스</b><span>연예</span><span>스포츠</span><span>경제</span><span>라이프</span></div><div class="breaking"><i>LIVE</i> 트루뷰 체육관 사건 · 현장 통제 중</div><section class="trends"><h3>지금 많이 찾는 검색어</h3><div class="trend-grid"></div></section><section class="news-list"><div class="news-heading"><h3>많이 본 뉴스</h3><span>실시간</span></div><div class="news-items"></div></section><footer class="portal-footer">나인 포털 · 뉴스 서비스</footer>';['서프 에이스','트루뷰 체육관','맨몸의 도전자','영혼 주입','레귤레이터','아르카디아'].forEach((term,i)=>{let b=document.createElement('button');b.innerHTML=`<em>${i+1}</em><span>${term}</span><small>▲</small>`;b.onclick=()=>filterNews(term);$('.trend-grid').append(b)});renderNews(newsData.map((n,i)=>i));setupRecentSearches();$('.portal-search form').onsubmit=e=>{e.preventDefault();filterNews($('.portal-search input').value)}}
function filterNews(term){const ids=newsData.map((n,i)=>(n.title+n.body.join('')).includes(term.trim())?i:-1).filter(i=>i>=0);renderNews(ids);$('.news-heading h3').textContent=term?'검색 결과':'많이 본 뉴스'}
function renderNews(ids){const target=$('.news-items');target.innerHTML='';if(!ids.length){target.innerHTML='<div class="no-news">검색 결과가 없습니다.</div>';return}ids.forEach(i=>{const n=newsData[i];let b=document.createElement('button');b.className='news-card';b.innerHTML=`<span class="news-thumb gradient-${i}" aria-hidden="true"></span><span class="news-card-copy"><strong>${n.title}</strong><small>${n.paper} · ${n.time} · 댓글 ${n.count}</small></span>`;b.onclick=()=>articleOpen(i);target.append(b)})}

const calendarDays=30,calendarStart=0;
const matchSchedule={13:'오후 2:00'};
function daySchedule(day){if(day===25)return [];if(day===4)return [{label:'정기검진',time:'오전 9:30',kind:'clinic'}];const weekday=(calendarStart+day-1)%7;const events=[];if([1,2,4,5].includes(weekday)&&!matchSchedule[day])events.push({label:'사격 연습',time:'오후 7:00',kind:'shoot'});if([0,6].includes(weekday)&&!matchSchedule[day-1])events.push({label:'체력보강훈련',time:'오전 10:00',kind:'strength'});if(weekday===3)events.push({label:'훈련',time:'오후 1:00',kind:'training'});if(day===7)events.push({label:'정형외과 방문',time:'오후 2:30',kind:'clinic'});if(matchSchedule[day])events.push({label:'경기',time:matchSchedule[day],kind:'match'});return events.sort((a,b)=>calendarTime(a.time)-calendarTime(b.time))}
function calendarTime(t){const [period,time]=t.split(' '),[h,m]=time.split(':').map(Number);return (h%12+(period==='오후'?12:0))*60+m}

let sudokuOriginal='100007090030020008009600500005300900010080002600004000300000010040000007007000300'.split('').map(Number);
let sudokuPuzzle='102857493534129678789603521475312986913586702628794135356408219241935867897201354'.split('').map(Number);
let sudokuValues=[...sudokuPuzzle],sudokuSelected=-1,sudokuComplete=false,sudokuStage=1894;
function sudokuValid(values,index){const value=values[index];if(!value)return true;const r=Math.floor(index/9),c=index%9;return !values.some((n,i)=>i!==index&&n===value&&(Math.floor(i/9)===r||i%9===c||(Math.floor(Math.floor(i/9)/3)===Math.floor(r/3)&&Math.floor((i%9)/3)===Math.floor(c/3))))}
function renderSudoku(){const panel=$('.panel');panel.classList.add('sudoku-app');$('.panel header').textContent='스도쿠';const m=$('.panel main');if(sudokuComplete){if(sudokuStage===1895){m.innerHTML='<div class="sudoku-finish"><strong>다음 스테이지는 업데이트 중입니다.</strong></div>'}else{m.innerHTML='<div class="sudoku-finish"><strong>축하합니다, Pe00님!</strong><button class="sudoku-next">다음 스테이지</button></div>';$('.sudoku-next').onclick=()=>{sudokuStage=1895;sudokuOriginal='530070000600195000098000060800060003400803001700020006060000280000419005000080079'.split('').map(Number);sudokuPuzzle=[...sudokuOriginal];sudokuValues=[...sudokuPuzzle];sudokuSelected=-1;sudokuComplete=false;renderSudoku()}}return}m.innerHTML='<div class="sudoku-progress"><span>Pe00</span><span>클리어 기록 <b>'+String(sudokuStage-1)+'</b></span></div><div class="sudoku-stage"><strong>STAGE '+sudokuStage+'</strong><small>고난도</small></div><div class="sudoku-board" role="group" aria-label="스도쿠 퍼즐"></div><div class="sudoku-keypad"></div><div class="sudoku-utility"><button class="sudoku-erase">지우기</button></div>';sudokuValues.forEach((v,i)=>{const b=document.createElement('button');b.className='sudoku-cell'+(sudokuPuzzle[i]?(sudokuOriginal[i]?' given':' perlo-filled'):' editable')+(i===sudokuSelected?' chosen':'')+(!sudokuValid(sudokuValues,i)?' conflict':'');const r=Math.floor(i/9),c=i%9;if(c===2||c===5)b.classList.add('box-right');if(r===2||r===5)b.classList.add('box-bottom');b.textContent=v||'';b.setAttribute('aria-label',(r+1)+'행 '+(c+1)+'열 '+(v||'빈칸')+(sudokuPuzzle[i]?(sudokuOriginal[i]?' 고정 숫자':' 페를로가 입력한 숫자'):''));b.onclick=()=>{sudokuSelected=i;renderSudoku()};$('.sudoku-board').append(b)});for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>setSudokuNumber(n);$('.sudoku-keypad').append(b)}$('.sudoku-erase').onclick=()=>setSudokuNumber(0)}
function setSudokuNumber(n){if(sudokuComplete||sudokuSelected<0||sudokuPuzzle[sudokuSelected])return;sudokuValues[sudokuSelected]=n;if(sudokuValues.every((v,i)=>v&&sudokuValid(sudokuValues,i)))sudokuComplete=true;renderSudoku()}

function openNote(i){current='메모상세';const note=perloNotes[i],panel=$('.panel');panel.classList.remove('notes-app');panel.classList.add('note-detail-app');const h=$('.panel header');h.innerHTML='<button class="note-back" aria-label="메모 목록으로">‹</button>';const title=document.createElement('strong');title.textContent=note.title;h.append(title);$('.note-back').onclick=()=>openApp('메모');const m=$('.panel main');m.className='note-detail-content';m.innerHTML='';const date=document.createElement('div');date.className='note-date';date.textContent=note.date;const body=document.createElement('div');body.className='note-body';body.textContent=note.body;m.append(date,body)}

function galleryShell(title,back){const panel=$('.panel');panel.classList.add('gallery-app');panel.classList.remove('gallery-view-app');$('.panel .composer')?.remove();$('.panel .tabs')?.remove();$('.screen').classList.remove('gallery-viewing');const h=$('.panel header');h.innerHTML='';if(back){const b=document.createElement('button');b.className='gallery-back';b.textContent='‹';b.setAttribute('aria-label','갤러리 뒤로');b.onclick=back;h.append(b)}const t=document.createElement('strong');t.textContent=title;h.append(t);const m=$('.panel main');m.className='gallery-content';m.style.background='';m.innerHTML='';m.scrollTop=0;return m}
function galleryHome(){current='갤러리';const m=galleryShell('갤러리');Object.entries(galleryData).forEach(([name,items])=>{const row=document.createElement('button');row.className='gallery-album';const thumb=document.createElement('span');thumb.className='album-thumb';thumb.style.background=galleryColor(name,0);const info=document.createElement('span');info.className='album-info';const title=document.createElement('strong');title.textContent=name;const count=document.createElement('small');count.textContent=items.length+'개';info.append(title,count);row.append(thumb,info);row.onclick=()=>galleryAlbum(name);m.append(row)})}
function galleryAlbum(name){galleryActiveAlbum=name;current='사진앨범';const m=galleryShell(name,galleryHome);const grid=document.createElement('div');grid.className='gallery-photo-grid';galleryData[name].forEach((caption,i)=>{const b=document.createElement('button');b.className='gallery-photo'+(name==='screenshot'?' pale':'');b.style.background=galleryColor(name,i);const label=document.createElement('span');label.textContent=caption;b.append(label);b.onclick=()=>galleryPhoto(name,i);grid.append(b)});m.append(grid)}
function galleryPhoto(name,i){current='사진보기';const m=galleryShell('',()=>galleryAlbum(name));$('.panel').classList.add('gallery-view-app');$('.screen').classList.add('gallery-viewing');m.className='gallery-full';m.style.background=galleryColor(name,i);m.classList.toggle('pale',name==='screenshot');const caption=document.createElement('div');caption.className='gallery-full-caption';caption.textContent=galleryData[name][i];m.append(caption)}

function inside(e){const rect=screen.getBoundingClientRect(),x=(e.clientX-rect.left)*360/rect.width,y=(e.clientY-rect.top)*810/rect.height;return Math.hypot(x-112,y-685)<=29}
