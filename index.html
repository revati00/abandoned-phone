function openChat(name){current='대화';const panel=$('.panel');panel.classList.remove('phone-app','messages-app');panel.classList.add('chat-app');$('.panel .tabs')?.remove();const h=$('.panel header');h.innerHTML='';const back=document.createElement('button');back.className='chat-back';back.setAttribute('aria-label','메시지 목록으로');back.textContent='‹';back.onclick=()=>openApp('메시지');const avatar=document.createElement('span');avatar.className='chat-avatar';senderAvatar(avatar,name);const title=document.createElement('strong');title.textContent=name==='배달부셔토나 귀접힘 시끄러움'?'배달부셔토나':name==='갈색머리셔토나 기자 형'?'갈색머리셔토나 ···':displaySender(name);title.title=displaySender(name);const more=document.createElement('button');more.className='chat-more';more.textContent='⋮';more.setAttribute('aria-label','더 보기');if(serviceSenders.includes(name)||blockedSenders.includes(name)){const titleGroup=document.createElement('div');titleGroup.className='chat-title-group';const label=document.createElement('small');label.textContent='(저장되지 않은 번호)';titleGroup.append(title,label);h.append(back,avatar,titleGroup,more)}else{h.append(back,avatar,title,more)}const m=$('.panel main');m.className='chat-messages';m.innerHTML='';let todayDateShown=false;chatData[name].forEach(group=>{if(group.date!=='오늘'||!todayDateShown){const date=document.createElement('div');date.className='chat-date';date.textContent=group.date;m.append(date);if(group.date==='오늘')todayDateShown=true;}group.messages.forEach(msg=>{const row=document.createElement('div');row.className='bubble-row '+(msg.self?'sent':'received');const b=document.createElement('div');b.className='bubble';if(msg.attachment){b.classList.add('chat-file-bubble');const icon=document.createElement('span');icon.className='chat-file-icon';icon.textContent='↓';const info=document.createElement('div');const fileTitle=document.createElement('div');fileTitle.textContent='제목: '+msg.attachment.name;const size=document.createElement('small');size.textContent='메시지 크기: '+msg.attachment.size;const expiry=document.createElement('small');expiry.textContent='만료: '+msg.attachment.expiry;info.append(fileTitle,size,expiry);b.append(icon,info)}else if(msg.image){b.classList.add('chat-image-bubble');b.setAttribute('role','img');b.setAttribute('aria-label','미야하가 보낸 사진');b.style.background='linear-gradient(145deg,#b2cbd5,#5e85a0 55%,#334c6a)'}else b.textContent=msg.text;row.setAttribute('aria-label',(msg.self?'페':name==='미야하💙'?'미':name==='갈색머리셔토나 기자 형'?'메':name==='배달부셔토나 귀접힘 시끄러움'?'쿠':name[0])+': '+msg.text);row.append(b);m.append(row)})});panel.querySelector('.composer')?.remove();const composer=document.createElement('form');composer.className='composer';composer.innerHTML='<input aria-label="메시지 입력" disabled><button type="button" aria-label="보내기" disabled>↑</button>';panel.append(composer);if(blockedSenders.includes(name)){const notice=document.createElement('div');notice.className='blocked-notice';notice.textContent='차단된 사용자입니다.';m.append(notice)}m.scrollTop=m.scrollHeight}

const newsData=[{"tag": "속보", "title": "트루뷰 체육관서 서프 에이스 난동… 다수 사상자, 현장 수습 중", "paper": "솔루션 투데이", "time": "12분 전", "count": "2,418", "body": ["트루뷰 트라이테일 체육관에서 아르카디아 투사 서프 에이스가 마물 영혼을 주입한 뒤 갑자기 난동을 부려 다수의 사상자가 발생했다. 현장 통제와 피해자 이송은 현재도 이어지고 있다.", "목격자들에 따르면 서프 에이스는 총기를 난사하듯 무차별적인 타겟 지정 능력을 넓은 범위에 사용했다. 체육관 이용객뿐 아니라 대피하던 시민들도 공격 범위에 포함된 것으로 전해졌다.", "부상자 중에는 레귤레이터를 통해 소생한 시민도 있는 것으로 알려졌다. 그러나 레귤레이터 미착용자와 저장된 영혼 자원을 모두 소모한 시민 일부는 사망했다. 당국은 정확한 피해 규모와 신원을 확인 중이며 최종 집계는 아직 공개하지 않았다.", "이후 서프 에이스는 마물과 유사한 형태로 변해 체육관 밖으로 도주한 것으로 전해졌다. 맨몸의 도전자와 교전하던 중 신체가 녹아 사라졌다는 목격 진술도 확보됐다.", "당국은 현장에 남은 잔류 물질을 조사하고 있다. 서프 에이스의 생사와 소생 여부는 확인되지 않았으며, 주변 시민들에게 통제 구역에 접근하지 말 것을 요청했다."], "comments": ["능력광역기인거 알면서 저기서 쳐쓴게 레전드네 ㅋㅋㅋㅋ", "운동하러 간 분들이 무슨 죄입니까. 사망하신 분들 가족은 어쩌라고요. 철저하게 조사해 주세요.", "와씨발 나 어제 저기갔는데 오늘갔으면 뒤졋겠네", "소생 되면 다 끝인줄 아나... 세상이 어찌 이리 됐는지...", "팬들 또 영혼침식 어쩌고 시작했노 ㅋㅋ 그럼 피해자도 아프다면서 쏘면 되냐?", "레귤레이터 안 찬 사람이 잘못이라는 새끼는 진짜 대가리 열어보고 싶다", "기사 끝까지 읽어라 생사 확인 안됐다잖아 벌써 죽었다고 뇌피셜 돌리지말고", "불쌍한 건 피해자지 저새끼가 아니라고요 제발 좀"], "commentIds": ["o4coer2", "a1ckfg", "vl5wzh1", "kruduq6r8", "vgnt78", "6oeyge", "x6ol3m2ka", "hm0fwlk4"]}, {"tag": "현장", "title": "“도망치는 사람까지 겨눴다” 무차별 타겟 지정에 아수라장", "paper": "나인일보", "time": "28분 전", "count": "1,906", "body": ["평소와 다르지 않던 체육관은 순식간에 대피 현장으로 바뀌었다. 트루뷰 트라이테일 체육관 이용객들은 서프 에이스의 공격이 특정 상대를 향한 것이 아니었다고 입을 모았다.", "한 이용객은 “누가 상대인지도 모르겠더라. 도망치는 사람까지 타겟이 됐다”며 “경기장이 아닌 곳에서 그런 능력을 쓰면 시민들은 어떻게 피하느냐”고 말했다.", "또 다른 목격자는 서프 에이스가 영혼을 주입한 직후 행동이 급격히 달라졌다고 진술했다. 다만 주입 경위와 난동의 직접적인 원인은 조사 중이다.", "레귤레이터가 있다는 이유로 피해를 가볍게 볼 수 없다는 비판도 나온다. 현장에서는 영혼 자원 소진자와 레귤레이터 미착용자의 사망이 발생했고, 소생한 피해자 역시 부상과 공포를 호소하고 있다.", "현재 체육관 운영은 중단됐다. 구조 인력은 잔류 위험 요소를 확인하며 내부 수색을 이어가고 있다."], "comments": ["도망가는사람까지찍음? 미친거아님????", "총질 잘한다고 띄워주니까 지가 뭐라도 되는 줄 알았나보네 ㅉㅉ", "아니 진짜 무서워요.. 저기 친구 다니는데 연락이 안 돼요", "저거 쉴드치던 팬덤 어디감? 입꾹닫하고 튀었쥬?ㅋㅋ", "그렇게 성깔 더럽게 굴더니 결국 사고를 치는구만. 사람은 안 바뀐다.", "폭주고 나발이고 씨발 사람 죽었는데 컨디션이 왜나와"], "commentIds": ["krzw1v5", "vcl680", "f6s7o96g7", "qbey3wegy", "tvt3acupo", "jmvm0klk5"]}, {"tag": "추적", "title": "마물화 후 도주, 도전자와 교전 중 소실… 서프 에이스 행방 불명", "paper": "에버킵 저널", "time": "43분 전", "count": "3,104", "body": ["체육관 난동 이후 도주한 서프 에이스가 맨몸의 도전자와 맞붙던 중 녹아 사라졌다는 진술이 나왔다. 현장에 남은 물질과 목격 영상은 당국이 확보해 분석 중이다.", "복수의 목격자들은 도주 당시 그의 외형을 사람보다는 마물에 가까웠다고 묘사했다. 변이 과정과 마물 영혼 주입 사이의 관련성은 아직 확인되지 않았다.", "교전 이후 서프 에이스의 신병은 확보되지 않았다. 신체 소실이 사망을 의미하는지, 레귤레이터를 통한 소생 가능성이 남아 있는지는 공식적으로 확인되지 않았다.", "온라인에서는 도주 책임과 신병 확보를 요구하는 목소리가 높다. 당국은 확인되지 않은 목격담을 무분별하게 유포하지 말 것을 당부하면서도 사건 관련 제보를 접수하고 있다."], "comments": ["녹아서 런 ㅋㅋ 책임회피도 아주 가지가지하네", "살았는지 죽었는지부터 확실히 밝혀야 합니다. 이대로 흐지부지 넘어갈 일 아닙니다.", "시체가없는데 죽었다는건 누구피셜임?", "맨몸의 도전자가 치운거네 ㄹㅇ 뒷수습까지 남이 해주노", "마물됐다고 면책해주는거 아니지??? 제발 아니라고 해줘", "도주...소실... 아주 편리하네요^^ 피해자만 남았네요^^"], "commentIds": ["zo52tw08o", "6pv85n", "6mndx2y", "670f18lu", "rt3mm8", "lxzq77"]}, {"tag": "쟁점", "title": "“소생 못 하는 사람은 어쩌나” 레귤레이터 밖으로 밀려난 피해자들", "paper": "솔루션 투데이", "time": "1시간 전", "count": "1,287", "body": ["서프 에이스의 체육관 난동 사건으로 일부 시민이 사망하면서 레귤레이터와 영혼 자원 보유 여부가 생사를 갈랐다는 사실에 분노가 커지고 있다.", "현장 피해자 중 레귤레이터를 착용하지 않았거나 저장된 영혼 자원을 모두 소모한 일부 시민은 소생하지 못한 것으로 알려졌다. 피해 규모는 아직 집계 중이다.", "시민들은 “누군가에게는 소생할 수 있는 사고여도 다른 사람에게는 마지막이 된다”며 투사의 능력 사용을 통제할 장치가 필요하다고 지적했다.", "영혼 자원을 통해 소생했다는 사실만으로 피해가 사라지는 것은 아니다. 당국은 생존 피해자의 치료와 현장 수습을 우선 진행하고 있으며, 유가족 지원 방안도 검토 중이다."], "comments": ["영혼 살 돈 없으면 걍 뒤지란거네 좆같다", "사람 목숨이 자원 보유량에 달린 세상이라니… 참 씁쓸합니다.", "레귤레이터 왜안찼냐는놈들아 니들이 돈대줌?", "소생했으니까 사상자에서 빼라는 댓글 보고 할 말을 잃음 진짜", "우리 아버지도 자원 없으신데 남일 같지가 않네요. 피해자분들 쾌유를 빕니다", "서프에이스인지 뭔지 그깟 광대새끼 하나 때문에 이게 뭐냐고"], "commentIds": ["uo2o574b9", "jbfb59opo", "k5zir7", "6no6yb2n8", "ub192d", "6k0t9utsx"]}, {"tag": "논란", "title": "링 밖에서도 통제 안 된 투사… 아르카디아 관리 책임론 확산", "paper": "나인포커스", "time": "2시간 전", "count": "2,562", "body": ["트루뷰 트라이테일 체육관 난동 사건 이후 서프 에이스 개인의 책임과 함께 아르카디아의 투사 관리 체계를 비판하는 목소리가 커지고 있다.", "서프 에이스는 무차별적인 광범위 타겟 지정 능력을 사용한 뒤 마물과 유사한 형태로 변해 도주한 것으로 알려졌다. 시민들은 위험한 능력을 지닌 투사가 일반 시설에서 영혼을 주입할 수 있었던 경위를 밝혀야 한다고 요구하고 있다.", "온라인에서는 과거 링 위의 과격한 연출을 문제 삼는 의견도 이어지고 있다. 다만 과거 경기 장면만으로 이번 사건의 원인을 단정할 수는 없으며, 구체적인 주입 경위와 통제 실패 과정은 조사 결과를 기다려야 function netShell(){const panel=$('.panel');panel.classList.add('internet-app');panel.classList.remove('chat-app','messages-app','phone-app');$('.panel .composer')?.remove();$('.panel .tabs')?.remove();$('.panel header').innerHTML='<button class="net-home" aria-label="인터넷 홈">⌂</button><div class="address">▣ &nbsp; 나인 포털</div><button class="net-refresh" aria-label="새로고침">↻</button>';$('.net-home').onclick=internetHome;$('.net-refresh').onclick=()=>{if(current==='기사')articleOpen(activeArticle);else if(current==='검색결과')showAlternateSearch(activeSearchTerm);else internetHome()};$('.panel main').className='net-content';$('.panel main').scrollTop=0;return $('.panel main')}

function daySchedule(day){if(alternateTimeline)return alternateDaySchedule(day);if(day===25)return [];if(day===4)return [{label:'정기검진',time:'오전 9:30',kind:'clinic'}];const weekday=(calendarStart+day-1)%7;const events=[];if([1,2,4,5].includes(weekday)&&!matchSchedule[day])events.push({label:'사격 연습',time:'오후 7:00',kind:'shoot'});if([0,6].includes(weekday)&&!matchSchedule[day-1])events.push({label:'체력보강훈련',time:'오전 10:00',kind:'strength'});if(weekday===3)events.push({label:'훈련',time:'오후 1:00',kind:'training'});if(day===7)events.push({label:'정형외과 방문',time:'오후 2:30',kind:'clinic'});if(matchSchedule[day])events.push({label:'경기',time:matchSchedule[day],kind:'match'});return events.sort((a,b)=>calendarTime(a.time)-calendarTime(b.time))}

function solveSudokuHint(puzzle){const values=[...puzzle];if(values.some((v,i)=>v&&!sudokuValid(values,i)))return null;function solve(){let target=-1,choices=[];for(let i=0;i<81;i++){if(values[i])continue;const candidates=[];for(let n=1;n<=9;n++){values[i]=n;if(sudokuValid(values,i))candidates.push(n)}values[i]=0;if(!candidates.length)return false;if(target<0||candidates.length<choices.length){target=i;choices=candidates;if(choices.length===1)break}}if(target<0)return true;for(const n of choices){values[target]=n;if(solve())return true}values[target]=0;return false}return solve()?values:null}

const alternateSurfArticles=[{"tag":"은퇴 투사 특집","title":"[은퇴한 투사] 서프 에이스, 링 밖에서 찾은 다음 날","paper":"SBE 방송국","author":"SBE 특집 제작팀","time":"3개월 전","body":["SBE 「은퇴한 투사」 서프 에이스 편에서는 은퇴 후 재활 치료를 받고 있는 그의 근황을 전했다. 서프 에이스는 아직 치료를 이어가고 있지만, 예전보다 몸 상태가 나아져 제거인 의뢰도 맡고 있다고 말했다.","그를 오랫동안 괴롭혔던 에테르 불균형에 따른 병세도 점차 완화되고 있다. 회복 속도에 대해서는 조심스러웠다. “한꺼번에 좋아지는 건 아니라. 그냥 전보다 덜 아프고, 할 수 있는 게 늘어나는 거지.” 의뢰를 받을 때도 몸 상태를 먼저 살피고, 무리가 되면 쉬려고 한다고 했다.","총은 지금도 좋아한다. 방송에서 그가 보여준 총기 묘기는 현역 때와 크게 다르지 않았다. 손안에서 총을 돌려 쥐고 자세를 바꾸는 동작이 여전히 빨랐다. 그는 “좋아하는 거니까. 당연히 이 정도는 해야지. 어떻게 내가 가장 빛났던 순간을 잊을 수 있겠어?” 라고 말했다.","인터뷰어가 왼손 약지의 반지를 가리키자 서프 에이스는 손을 내려다보고 비식 웃었다. “좋아하는 사람이 생겼어. 그 사람이랑 평생 같이 살고 싶고.” 상대에 대한 질문에는 짧게 답했지만, 반지 이야기가 나오는 동안에는 웃음이 남아 있었다.","자신을 걱정하고 응원해 준 팬들에게도 인사를 전했다. “걱정하고, 좋아해 준 거 알아. 그러니까... 고맙습니다. 저는 잘 지내고 있어요.” 그는 링에 돌아가기보다는 치료를 계속하며 지금의 생활을 이어갈 생각이라고 밝혔다."],"comments":["반지 얘기할 때 웃는 거 봤냐고ㅠㅠㅠ 사수님 행복하세요 진짜로","재활 잘 받고 계신다니 마음이 놓입니다. 오래 건강하게 지내셨으면 좋겠어요.","아 은퇴하고 인생 2막 제대로 즐기는 중이었네ㅋㅋ 보기 좋다","그 손놀림 어디 안 가는구만. 총도 사랑도 끝까지 멋지게 챙기십쇼!"],"searchOnly":true,"count":"4","commentIds":["sky27user","sky46user","sky65user","sky84user"],"commentTimes":["3개월 전","3개월 전","3개월 전","3개월 전"]},{"tag":"스포츠 · 은퇴","title":"서프 에이스, 통합 챔피언 축하 뒤 은퇴 선언… “이기고 싶었지만 미련은 없다”","paper":"스카이라인 언론사","author":"메흐아로 기자","time":"5년 전","body":["서프 에이스가 맨몸의 도전자와의 경기를 끝으로 은퇴한다. 그는 아르카디아의 새로운 통합 챔피언에게 축하를 전한 뒤, 건강상의 이유로 선수 생활을 마치겠다고 밝혔다.","맨몸의 도전자가 도발의 뜻으로 은퇴를 요구했던 만큼, 이후 결정을 번복한 투사들도 있었다. 서프 에이스는 복귀할 생각이 없다고 했다. 상대의 요구보다는 오래 누적된 몸의 부담이 은퇴를 결정한 이유라고 설명했다.","“몸이 더는 못 버텨. 애초에 항상 무리하게 움직이고 있었어서, 계속 쉬어야겠다고 생각했어. 지금은 그걸 더 미룰 수가 없는 거야, 마침 좋은 이유도 생겼고.” 어린 나이부터 좋지 않은 몸 상태로 경기를 이어온 그는 당분간 회복에 집중할 계획이다. “누가 그만하라고 해서 그만하는 게 아냐.”라는 말도 덧붙였다.","마지막 경기에 대해서는 아쉬움과 만족을 함께 드러냈다. “나는 최선을 다했어. 쓸 수 있는 모든 수를 쓰고, 할 수 있는 모든 걸 다 보였다. 그게 내 마지막 총성이겠지. 내 경기 중에서 가장 좋은 경기였어.” 승리하지 못한 점을 묻자 “이기고 싶었지, 그럼. 누가 패배자가 되고 싶어 하는데? 그래도 미련은, 없으니까. 됐나...”라고 답했다.","새 통합 챔피언이 된 맨몸의 도전자에게는 “얼간이, 내가 너 같은 새끼한테 밟혔다니 짜증나. 그래도, 뭐, 음, 실은 어렴풋이 알고 있었거든. 내가 질 거라는 거. 그러니까 그런 힘과 실력을 가졌으면 더 세게 나가라고. 영원히 타는 불꽃처럼, 알잖아?”라고 전했다. 은퇴 소식을 접한 팬들은 마지막 경기를 아쉬워하면서도 치료와 휴식을 응원하고 있다. 서프 에이스는 자신을 걱정하는 팬들에게 고맙다는 뜻을 밝혔다."],"comments":["마지막 경기 정말 최고였습니다. 이젠 본인 몸부터 챙겨 주세요.","어린 나이에 얼마나 무리했을지…ㅠㅠ 아쉽지만 쉬는 결정 응원해요","번복 안 해도 됨. 사수님 하고 싶은 대로 하자. 우린 경기 오래 기억할게","졌다고 멋없어지는 선수가 아님 ㅇㅇ 끝까지 자기 경기 하고 내려간 거 존중함","그동안 즐거웠어요! 푹 쉬고 건강해지세요♡"],"searchOnly":true,"count":"5","commentIds":["sky40user","sky59user","sky78user","sky97user","sky116user"],"commentTimes":["5년 전","5년 전","5년 전","5년 전","5년 전"]},{"tag":"스포츠 · 인터뷰","title":"일곱 발의 사수 서프 에이스, 크루저급으로 월장하다","paper":"스카이라인 언론사","author":"메흐아로 기자","time":"6년 전","body":["아르카디아의 신인 투사 서프 에이스가 크루저급으로 월장했다. 데뷔 이후 샷건과 극독을 앞세운 빠른 공방으로 주목받은 그는 최근 관중 사이에서 일곱 발의 사수라는 이명을 알리고 있다.","서프 에이스의 경기는 거칠고 빠르다. 사격 뒤 곧바로 거리를 좁히거나 상대의 공격을 피하는 동시에 격발을 위한 탄알을 준비하는 등, 격한 몸싸움 중에도 사격 동작이 끊기지 않는 데다 과감하게 맞붙는 장면이 많아, 짧은 시간에 링 위를 크게 뒤트는 재능이 있다는 평가가 주를 이룬다. 주로 샷건을 쓰지만 다른 총기를 다루는 솜씨도 능숙하다.","경기를 마친 뒤 만난 서프 에이스는 월장 소감을 묻자 “이건 당연한 거야, 거창한 소감까지 필요한 일인가?”라고 답했다. 가장 잘 다루는 총은 역시 샷건이었지만 종류를 굳이 가려 쓰지는 않는다고 했다. “상황에 맞는 걸 쓰는 거지, 적재적소에 딱 들어맞는 용도가 있으니까. 취향을 따지면서 무기를 잡으려면 실력이 되어야 해. 그리고 나는, 그게 되니까 샷건을 우선하는 거다.”","빠른 전투 방식에 대해서는 “상대는 내 타겟이야, 쏘아맞춰도 일어나면 이긴 게 아니잖아. 손가락이 트리거 위에 있는데, 기회를 걷어차는 게 멍청한 거 아냐? 이 속도를 따라오지 못하는 어중이떠중이는 짓밟히는 게 규칙이지.”라고 설명했다. 실제 경기에서도 상대의 빈틈을 확인한 뒤 발사하기까지 망설임이 적었다. 여러 총기를 바꿔 쓰면서도 그 속도를 유지하는 점이 눈에 띄었다.","과감한 경기 운영을 좋아하는 팬들이 늘었다는 말에는 “그렇겠지, 자극적이고 스릴 있는 걸 좋아할 테니까. 마음껏 부숴줄 테니 거기 앉아서 구경이나 해. 만족시켜주마.”라고 했다. 향후 목표는 짧게 답했다.","“앞을 막는 건 쳐부수면 그만이야.”"],"comments":["샷건 장전에서 다음 동작 넘어가는 거 진짜 미쳤음ㅋㅋ 경기 너무 재밌다","월장 축하드립니다! 부상 없이 오래 활약해 주세요."],"searchOnly":true,"count":"2","commentIds":["sky53user","sky72user"],"commentTimes":["6년 전","6년 전"]}];

function showMiyahaIncoming(){if(miyCallbackDelivered||!alternateTimeline)return;if($('.call-screen')){setTimeout(showMiyahaIncoming,1000);return}miyCallbackDelivered=true;activePerson='미야하💙';const c=document.createElement('section');c.className='call-screen incoming-call';c.innerHTML='<div class="incoming-label">전화 수신</div><h2>미야하💙</h2><div class="incoming-sub">휴대전화</div><div class="incoming-avatar">'+svg(tabIcons.contacts)+'</div><div class="incoming-actions"><button class="incoming-reject"><span class="round decline">'+svg(icons.전화)+'</span>거절</button><button class="incoming-answer"><span class="round accept">'+svg(icons.전화)+'</span>응답</button></div>';$('.screen').append(c);$('.screen').classList.add('on-call');$('.screen').classList.remove('in-app');let resolved=false;startRing(10);const reject=()=>{if(resolved)return;resolved=true;recordMiyahaIncoming('missed');closeCall();setTimeout(sendMiyahaFollowup,3000)};c.rejectIncoming=reject;c.querySelector('.incoming-reject').onclick=reject;c.querySelector('.incoming-answer').onclick=()=>{if(resolved)return;resolved=true;stopRing();recordMiyahaIncoming('incoming');c.classList.remove('incoming-call');c.innerHTML='<div class="call-top">통화 중<span class="video-mark">'+svg(controls.video)+'</span></div><h2>미야하💙</h2><div class="call-status">00:00</div><div class="dialogue" aria-live="polite"></div><div class="call-controls">'+[['record','녹음'],['mute','내 소리 차단'],['bluetooth','블루투스'],['speaker','스피커'],['keys','키패드'],['more','더 보기']].map(([k,label])=>'<button class="control" data-control="'+k+'"><span>'+svg(controls[k])+'</span><small>'+label+'</small></button>').join('')+'</div><button class="hangup" aria-label="통화 종료">'+svg(icons.전화)+'</button>';c.querySelector('.hangup').onclick=endCall;c.querySelectorAll('.control').forEach(b=>b.onclick=()=>{if(['mute','speaker'].includes(b.dataset.control))b.classList.toggle('enabled')});const started=Date.now();callTick=setInterval(()=>{const t=Math.floor((Date.now()-started)/1000);c.querySelector('.call-status').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);const show=i=>{const d=c.querySelector('.dialogue');if(!d)return;d.textContent=miyCallbackLines[i];d.classList.add('speaking');callTimers.push(setTimeout(()=>{d.classList.remove('speaking');callTimers.push(setTimeout(()=>i+1<miyCallbackLines.length?show(i+1):endCall(),500))},Math.max(3200,miyCallbackLines[i].length*115)))};callTimers.push(setTimeout(()=>show(0),1500))};callTimers.push(setTimeout(reject,7000))}

function bindVoicemailHold(button){let timer=null,held=false;const cancel=()=>{clearTimeout(timer);timer=null};button.onpointerdown=e=>{if(e.button!==0)return;held=false;cancel();button.setPointerCapture?.(e.pointerId);timer=setTimeout(()=>{held=true;openOriginalVoicemail()},650)};button.onpointerup=cancel;button.onpointercancel=cancel;button.onlostpointercapture=cancel;button.oncontextmenu=e=>e.preventDefault();button.addEventListener('click',e=>{if(held){e.preventDefault();e.stopImmediatePropagation();held=false}},true);button.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){held=false;cancel();timer=setTimeout(()=>{held=true;openOriginalVoicemail()},650)}});button.addEventListener('keyup',cancel)}

function playTimelineGlitch(){const screen=$('.screen');screen.querySelector('.timeline-glitch')?.remove();screen.classList.add('timeline-shifting');const glitch=document.createElement('div');glitch.className='timeline-glitch';glitch.setAttribute('aria-hidden','true');glitch.setAttribute('inert','');const slices=Array.from({length:4},()=>{const slice=document.createElement('div');slice.className='signal-slice';glitch.append(slice);return slice});const capture=()=>slices.forEach(slice=>{const clone=screen.cloneNode(true);clone.querySelectorAll('.timeline-glitch').forEach(e=>e.remove());clone.classList.remove('timeline-shifting');clone.removeAttribute('id');clone.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));clone.setAttribute('aria-hidden','true');slice.replaceChildren(clone)});capture();screen.append(glitch);const distort=()=>{slices.forEach((slice,i)=>{const top=Math.random()*94,height=1+Math.random()*9;const dx=(Math.random()-.5)*(i===0?32:12);slice.style.clipPath='inset('+top+'% 0 '+Math.max(0,100-top-height)+'% 0)';slice.style.transform='translateX('+dx+'px)';slice.style.opacity=Math.random()<.25?'0':'.85';slice.style.filter=i===0?'contrast(1.25) saturate(1.4)':'none'});glitch.style.opacity=Math.random()<.13?'.15':'1'};distort();const noise=setInterval(distort,70);setTimeout(capture,310);setTimeout(()=>{clearInterval(noise);glitch.remove();screen.classList.remove('timeline-shifting')},500)}
